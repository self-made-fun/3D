<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GAL-B-SCALE 5510 — 3D Viewer</title>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.1.0/model-viewer.min.js"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:Arial,sans-serif;background:#111;color:#fff}
header{position:fixed;top:0;left:0;right:0;z-index:5;padding:12px 16px;text-align:center;background:rgba(20,20,20,.9)}
h1{margin:0;font-size:18px}
p{margin:4px 0 0;color:#bbb;font-size:12px}
model-viewer{width:100%;height:100dvh;background:#e9e9e9}
.hint{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:5;background:#000b;padding:9px 14px;border-radius:20px;font-size:13px;white-space:nowrap;pointer-events:none}
</style>
</head>
<body>
<header><h1>GAL-B-SCALE 5510</h1><p>Drag to rotate • Pinch to zoom</p></header>
<model-viewer src="model.glb" alt="GAL-B-SCALE 5510 interactive 3D model"
 camera-controls touch-action="pan-y" auto-rotate shadow-intensity="1"
 exposure="1" environment-image="neutral" interaction-prompt="auto">
</model-viewer>
<div class="hint">↔ Rotate • Pinch to zoom</div>
</body>
</html>
