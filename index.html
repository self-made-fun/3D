<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Model Viewer</title>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.1.0/model-viewer.min.js"></script>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;font-family:Arial,sans-serif;background:#111;color:#fff}
  body{display:flex;flex-direction:column}
  header{padding:14px 16px;text-align:center;background:#1b1b1b}
  header h1{margin:0;font-size:20px}
  header p{margin:5px 0 0;color:#aaa;font-size:13px}
  model-viewer{width:100%;height:calc(100vh - 68px);height:calc(100dvh - 68px);background:#e9e9e9}
  .hint{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);
        background:rgba(0,0,0,.72);padding:9px 14px;border-radius:20px;
        font-size:13px;white-space:nowrap;pointer-events:none}
</style>
</head>
<body>
<header>
  <h1>3D Model</h1>
  <p>Drag to rotate • Pinch to zoom</p>
</header>

<model-viewer
  src="model.glb"
  alt="Interactive 3D model"
  camera-controls
  touch-action="pan-y"
  auto-rotate
  shadow-intensity="1"
  exposure="1"
  environment-image="neutral"
  interaction-prompt="auto">
</model-viewer>

<div class="hint">↔ Rotate &nbsp; • &nbsp; Pinch / scroll to zoom</div>
</body>
</html>
